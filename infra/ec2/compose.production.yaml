services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      IOT_SOURCE_ID: ${IOT_SOURCE_ID:?Set IOT_SOURCE_ID}
      IOT_SOURCE_KEY: ${IOT_SOURCE_KEY:?Set IOT_SOURCE_KEY}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      IOT_DEMO_ACCELERATED: ${IOT_DEMO_ACCELERATED:-true}
      IOT_DEMO_BATTERY: ${IOT_DEMO_BATTERY:-true}
      SIM_DEMO_STREAM: ${SIM_DEMO_STREAM:-true}
      SIM_VEHICLE_ID: ${SIM_VEHICLE_ID:-86e274aa-6305-4f51-92d5-b4b8eaf03e01}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
