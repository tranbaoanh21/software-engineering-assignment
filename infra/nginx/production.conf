server {
    listen 80;
    server_name __SEMH_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://__SEMH_HOST__$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __SEMH_HOST__;

    ssl_certificate /etc/letsencrypt/live/__SEMH_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SEMH_HOST__/privkey.pem;

    root /var/www/semh/current;
    index index.html;

    location ^~ /api/state-events {
        return 404;
    }

    location = /api/live {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
