 ry="12.5"/><text x="345.5" y="498.779" fill="#000" font-size="14" textLength="57.729">Rejected</text><g class="start_entity" data-qualified-name=".start." id="ent0008" data-source-line="20"><ellipse cx="470.5" cy="75.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0014" data-source-line="54"><ellipse cx="514.5" cy="561.488" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="514.5" cy="561.488" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="23"><path d="M530,175.488 L530,191.988 L511.563,195.988 L530,199.988 L530,216.109 A0,0 0 0 0 530,216.109 L849.067,216.109 A0,0 0 0 0 849.067,216.109 L849.067,185.488 L839.067,175.488 L530,175.488 A0,0 0 0 0 530,175.488" style="stroke:#181818;stroke-width:0.5;" fill="#FAFAFA"/><path d="M839.067,175.488 L839.067,185.488 L849.067,185.488 L839.067,175.488" style="stroke:#181818;stroke-width:0.5;" fill="#FAFAFA"/><text x="536" y="193.057" fill="#000" font-size="13" textLength="298.067">UC-PARK-01 chỉ tạo lượt đặt khi quyền hợp lệ,</text><text x="536" y="208.367" fill="#000" font-size="13" textLength="294.5">chỗ Available và giao dịch giữ chỗ thành công.</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="28"><path d="M89,49.488 L89,73.488 L71.309,77.488 L89,81.488 L89,105.42 A0,0 0 0 0 89,105.42 L441.583,105.42 A0,0 0 0 0 441.583,105.42 L441.583,59.488 L431.583,49.488 L89,49.488 A0,0 0 0 0 89,49.488" style="stroke:#181818;stroke-width:0.5;" fill="#FAFAFA"/><path d="M431.583,49.488 L431.583,59.488 L441.583,59.488 L431.583,49.488" style="stroke:#181818;stroke-width:0.5;" fill="#FAFAFA"/><text x="95" y="67.057" fill="#000" font-size="13" textLength="319.89">Pending và Rejected có trong danh mục trạng thái.</text><text x="95" y="82.367" fill="#000" font-size="13" textLength="331.583">UC-PARK-01 tạo Confirmed khi giữ chỗ thành công;</text><text x="95" y="97.678" fill="#000" font-size="13" textLength="310.953">baseline chưa quy định quy trình duyệt thủ công.</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="40"><path d="M498.5,301.488 L498.5,388.041 A0,0 0 0 0 498.5,388.041 L870.798,388.041 A0,0 0 0 0 870.798,388.041 L870.798,348.988 L888.712,344.988 L870.798,340.988 L870.798,311.488 L860.798,301.488 L498.5,301.488 A0,0 0 0 0 498.5,301.488" style="stroke:#181818;stroke-width:0.5;" fill="#FAFAFA"/><path d="M860.798,301.488 L860.798,311.488 L870.798,311.488 L860.798,301.488" style="stroke:#181818;stroke-width:0.5;" fill="#FAFAFA"/><text x="504.5" y="319.057" fill="#000" font-size="13" textLength="351.298">Không ghi đè OutOfService hoặc check-in vừa hoàn tất.</text><text x="504.5" y="334.367" fill="#000" font-size="13" textLength="286.413">Chỉ giải phóng thành Available khi chỗ trống,</text><text x="504.5" y="349.678" fill="#000" font-size="13" textLength="275.679">dữ liệu tin cậy và không có ràng buộc khác.</text><text x="504.5" y="364.988" fill="#000" font-size="13" textLength="297.521">Thiếu dữ liệu: chờ xác minh; chưa cấp phát lại.</text><text x="504.5" y="380.299" fill="#000" font-size="13" textLength="317.478">Cấp phát còn cần chỗ và Hub ServiceStatus.Active.</text></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="470.5,175.591,474.5,166.591,470.5,170.591,466.5,166.591,470.5,175.591" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M470.5,89.659 C470.5,109.478 470.5,146.015 470.5,170.591" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="475.55" y="138.057" fill="#000" font-size="13" textLength="160.266">/ tạo lượt đặt Confirmed;</text><text x="472.5" y="153.367" fill="#000" font-size="13" textLength="166.366">ParkingSpace -> Reserved</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk10" data-link-type="dependency"><polygon points="82.748,324.575,84.069,314.815,81.348,319.774,76.388,317.054,82.748,324.575" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M429.23,198.013 C335.522,200.763 113.037,209.845 90.5,234.488 C68.304,258.759 74.251,295.432 81.348,319.774" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="197.582" y="249.057" fill="#000" font-size="13" textLength="143.997">checkInPrivateVehicle()</text><text x="92.5" y="264.367" fill="#000" font-size="13" textLength="354.161">[còn hạn, đúng Sinh viên/xe/Hub/chỗ, cảm biến hợp lệ]</text><text x="100.323" y="279.678" fill="#000" font-size="13" textLength="338.514">/ ParkingSpace: Reserved -> Occupied; ghi checkInAt</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk11" data-link-type="dependency"><polygon points="903.342,324.673,900.348,315.29,900.018,320.938,894.371,320.609,903.342,324.673" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M511.657,213.897 C514.953,214.89 518.26,215.774 521.5,216.488 C635.048,241.526 672.752,196.078 782.5,234.488 C833.656,252.392 876.583,294.602 900.018,320.938" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="989.399" y="249.057" fill="#000" font-size="13" textLength="80.672">at(expiresAt)</text><text x="860.5" y="264.367" fill="#000" font-size="13" textLength="338.47">[vẫn Confirmed, chưa CheckedIn; kiểm tra nguyên tử]</text><text x="867.889" y="279.678" fill="#000" font-size="13" textLength="323.692">/ hủy giữ chỗ; chỉ mở lại khi an toàn (BR-PARK-02)</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk12" data-link-type="dependency"><polygon points="509.226,410.805,504.882,401.966,505.388,407.6,499.754,408.107,509.226,410.805" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M