g class="entity" data-qualified-name="InProgress" id="ent0003" data-source-line="8"><rect x="399" y="454.099" width="351.859" height="75.195" fill="#FFF" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="399" y1="482.497" x2="750.859" y2="482.497" style="stroke:#000;stroke-width:0.5;"/><text x="536.246" y="474.106" fill="#000" font-size="16" textLength="77.367" font-family="Arial">InProgress</text><text x="404" y="502.505" fill="#000" font-size="16" textLength="278.375" font-family="Arial">Vận chuyển vật lý diễn ra ngoài SEMH.</text><text x="404" y="520.903" fill="#000" font-size="16" textLength="331.859" font-family="Arial">Lưu tiến độ thực tế; không tự suy diễn vị trí xe.</text></g><g class="entity" data-qualified-name="Completed" id="ent0004" data-source-line="9"><rect x="6" y="612.099" width="321.648" height="56.797" fill="#FFF" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="6" y1="640.497" x2="327.648" y2="640.497" style="stroke:#000;stroke-width:0.5;"/><text x="128.137" y="632.106" fill="#000" font-size="16" textLength="77.375" font-family="Arial">Completed</text><text x="11" y="660.505" fill="#000" font-size="16" textLength="301.648" font-family="Arial">Lưu kết quả thực tế và lịch sử hoàn thành.</text></g><g class="entity" data-qualified-name="Cancelled" id="ent0005" data-source-line="10"><rect x="822.5" y="603.099" width="350.93" height="75.195" fill="#FFF" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="822.5" y1="631.497" x2="1173.43" y2="631.497" style="stroke:#000;stroke-width:0.5;"/><text x="962.387" y="623.106" fill="#000" font-size="16" textLength="71.156" font-family="Arial">Cancelled</text><text x="827.5" y="651.505" fill="#000" font-size="16" textLength="174.391" font-family="Arial">Lưu lý do và lịch sử hủy.</text><text x="827.5" y="669.903" fill="#000" font-size="16" textLength="330.93" font-family="Arial">Không tự hoàn tác việc vận chuyển đã diễn ra.</text></g><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="12"><ellipse cx="1000" cy="59.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="33"><path d="M1361,152.099 L1361,180.599 L1161.742,184.599 L1361,188.599 L1361,217.294 A0,0 0 0 0 1361,217.294 L1744.844,217.294 A0,0 0 0 0 1744.844,217.294 L1744.844,162.099 L1734.844,152.099 L1361,152.099 A0,0 0 0 0 1361,152.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M1734.844,152.099 L1734.844,162.099 L1744.844,162.099 L1734.844,152.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="1367" y="172.106" fill="#000" font-size="16" textLength="362.844" font-family="Arial">Tạo từ cảnh báo, chủ động hoặc dữ liệu điền trước</text><text x="1367" y="190.505" fill="#000" font-size="16" textLength="312.953" font-family="Arial">từ Recommendation đều phải được xem lại.</text><text x="1367" y="208.903" fill="#000" font-size="16" textLength="305.156" font-family="Arial">Khuyến nghị không tự phê duyệt kế hoạch.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="39"><path d="M756.5,296.099 L756.5,334.099 L738.828,338.099 L756.5,342.099 L756.5,379.692 A0,0 0 0 0 756.5,379.692 L1113.703,379.692 A0,0 0 0 0 1113.703,379.692 L1113.703,306.099 L1103.703,296.099 L756.5,296.099 A0,0 0 0 0 756.5,296.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M1103.703,296.099 L1103.703,306.099 L1113.703,306.099 L1103.703,296.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="762.5" y="316.106" fill="#000" font-size="16" textLength="336.203" font-family="Arial">Kiểm tra lại khi phê duyệt: xe thuộc Hub nguồn,</text><text x="762.5" y="334.505" fill="#000" font-size="16" textLength="305.836" font-family="Arial">Available, không bị giữ bởi nghiệp vụ khác;</text><text x="762.5" y="352.903" fill="#000" font-size="16" textLength="230.391" font-family="Arial">Hub đích có k