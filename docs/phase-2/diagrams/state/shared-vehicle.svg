s, xe InUse;</text><text x="627.975" y="797.526" fill="#000" font-size="14" textLength="375.737" font-family="Arial">Hub hợp lệ, có thể nhận xe; xác nhận vị trí và trả xe an toàn.</text><text x="627.975" y="813.625" fill="#000" font-size="14" textLength="587.774" font-family="Arial">safeReturnConfirmed ở bước 5; xét lại pin, tình trạng và cập nhật đồng bộ cùng Trip ở bước 7.</text><text x="627.975" y="829.724" fill="#000" font-size="14" textLength="619.336" font-family="Arial">Xét lỗi / hạn kiểm tra trước mức pin; chuyển SUB-CHG / SUB-OPS sau khi lưu thành công nếu cần.</text><text x="627.975" y="845.822" fill="#000" font-size="14" textLength="297.808" font-family="Arial">Thời hạn 10 phút tính từ khi lượt đặt Confirmed.</text><text x="627.975" y="861.921" fill="#000" font-size="14" textLength="368.806" font-family="Arial">Dữ liệu lỗi hoặc mất nguồn: giữ trạng thái hợp lệ cuối cùng.</text><text x="627.975" y="878.02" fill="#000" font-size="14" textLength="327.729" font-family="Arial">Lưu toàn bộ thay đổi cùng nhau; nếu lỗi thì hoàn tác.</text><text x="627.975" y="894.118" fill="#000" font-size="14" textLength="439.619" font-family="Arial">Ghi lịch sử thay đổi (NFR-AUD-01); sự cố: BR-OPS-02, NIFR-OPS-01.</text></g><?plantuml-src jLTDQnjN5DthLzmk2acnRBcjMv1eG5RY9D0wnXybu6JnD7gQUNZqtcJqnh5RkWXUP95DJGabXD8O4qpQc2HDmLHQT26J_w5_qdFVpCWZMKcWQHUMDU_Zt7FlFVVUaLKsbBGMY5YslfM1yl1KfaKrxEybTBe_xFz4DXxs3hHFDXWSg59tI-b8nA93JU5j-R59TAjXGXFJtK1PMTZl1g9bxYhSR8kmMznfoRP8Ghjaj5qM7KdrM8bm-lwQ-axI_EU5pOxHnWjYWtisJegmzJWsTrCkpH3a2blBnih5z_1rPqpSal5qZAuLLjBt9QBfI5W_Tvk8dIYk_53wA8g5tn4KYbsJMEfsf1LQb0BLaYGxaTs5_rqlLf5LHfUiYSWQQXfh3IAZOkcvzJDUsk2yZ6XXeR0O2xt5Yryib4efyVgsKA5eXZ9xNiMbU5ksiiVhUgERRpKW1n-9onvl9FP6Ums7bITBfSrFRbEvVAc0D_f6PIHSOo_7fYh5xgjWpWsZsohkoDOjlHafJPU-eiyg7zTeAnZy2PLuWzSKldavx1zQyY705rZvGrE0h_SJ2eVzLzxjMtgEBEHeHYUXqTw9fH5sBRkx8qiZ5ZajvoCu1KAtp3PdwepG15vgceLVmzAWn_o2OV-8ve2CZsj9qv6PkBQKX6qLXamZfRcEFCBkIcnyHA9Ru5GCuKISXFOaWz0cR74H7k4JNjrBQ8kZePrf-DaxL1G5WzTWD-Rl1BPeMnbVcA_msPwzI