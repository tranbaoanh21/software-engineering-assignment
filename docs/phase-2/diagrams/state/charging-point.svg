" fill="#000" font-size="13" textLength="231.969" font-family="Arial">Bật phục vụ không ghi đè OutOfService.</text><text x="59.206" y="528.087" fill="#000" font-size="13" textLength="250.06" font-family="Arial">UC-CHG-03 không tự ngắt phiên đang sạc.</text><text x="59.206" y="543.036" fill="#000" font-size="13" textLength="290.475" font-family="Arial">Sự cố: ghi nhận lỗi, đánh dấu phiên bị ảnh hưởng,</text><text x="59.206" y="557.985" fill="#000" font-size="13" textLength="247.222" font-family="Arial">tính lại phân bổ chưa bắt đầu và cảnh báo.</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk6" data-link-type="dependency"><polygon points="147.04,175.951,140.876,168.269,142.596,173.658,137.208,175.379,147.04,175.951" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M73.872,103.814 C76.837,112.784 81.98,125.276 89.706,134.099 C105.462,152.09 123.955,164.039 142.596,173.658" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-link-type="dependency"><polygon points="358.546,191.099,349.546,187.099,353.546,191.099,349.546,195.099,358.546,191.099" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M210.595,191.099 C250.401,191.099 313.155,191.099 353.546,191.099" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="220.956" y="169.292" fill="#000" font-size="13" textLength="127.194" font-family="Arial">allocateChargingPoint</text><text x="236.489" y="184.241" fill="#000" font-size="13" textLength="96.129" font-family="Arial">[không xung đột]</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk8" data-link-type="dependency"><polygon points="358.404,280.051,359.209,270.235,356.753,275.331,351.657,272.876,358.404,280.051" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:1