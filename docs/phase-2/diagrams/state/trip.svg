<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:844px;height:636px;background:#FFFFFF;" width="844px" height="636px" viewBox="0 0 844 636" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="340.021" y="23.132" fill="#000" font-size="14" textLength="157.883" font-weight="700" font-family="Arial">Trip - Biểu đồ trạng thái</text></g><rect x="393.5" y="153.099" width="77.696" height="40" fill="#FFF" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="398.5" y="178.181" fill="#000" font-size="14" textLength="67.696" font-family="Arial">InProgress</text><rect x="393.5" y="306.099" width="77.703" height="40" fill="#FFF" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="398.5" y="331.181" fill="#000" font-size="14" textLength="67.703" font-family="Arial">Completed</text><rect x="460.5" y="50.099" width="77.71" height="40" fill="#FFF" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="465.5" y="75.181" fill="#000" font-size="14" textLength="67.71" font-family="Arial">Interrupted</text><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="23"><ellipse cx="432.5" cy="68.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0007" data-source-line="25"><ellipse cx="320.5" cy="419.099" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="320.5" cy="419.099" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="28"><path d="M6,128.099 L6,218.592 A0,0 0 0 0 6,218.592 L374.895,218.592 A0,0 0 0 0 374.895,218.592 L374.895,177.099 L393.181,173.099 L374.895,169.099 L374.895,138.099 L364.895,128.099 L6,128.099 A0,0 0 0 0 6,128.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M364.895,128.099 L364.895,138.099 L374.895,138.099 L364.895,128.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="12" y="146.23" fill="#000" font-size="14" textLength="248.869" font-family="Arial">UC-TRIP-01: Xác nhận bàn giao hợp lệ.</text><text x="12" y="162.329" fill="#000" font-size="14" textLength="319.737" font-family="Arial">Lượt đặt Confirmed, còn hạn, đúng chủ, xe và Hub.</text><text x="12" y="178.428" fill="#000" font-size="14" textLength="224.021" font-family="Arial">Cập nhật đồng bộ: lượt đặt Fulfilled,</text><text x="12" y="194.526" fill="#000" font-size="14" textLength="347.895" font-family="Arial">xe InUse; tạo Trip.InProgress, lưu thông tin đầu chuyến.</text><text x="12" y="210.625" fill="#000" font-size="14" textLength="314.412" font-family="Arial">Thất bại: không tạo Trip; đọc lại để tránh tạo trùng.</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="36"><path d="M490,128.099 L490,169.099 L471.602,173.099 L490,177.099 L490,218.592 A0,0 0 0 0 490,218.592 L815.322,218.592 A0,0 0 0 0 815.322,218.592 L815.322,138.099 L805.322,128.099 L490,128.099 A0,0 0 0 0 490,128.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M805.322,128.099 L805.322,138.099 L815.322,138.099 L805.322,128.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="496" y="146.23" fill="#000" font-size="14" textLength="248.835" font-family="Arial">UC-TRIP-02: Hủy trả, Hub không hợp lệ</text><text x="496" y="162.329" fill="#000" font-size="14" textLength="256.84" font-family="Arial">hoặc thiếu xác nhận: giữ Trip.InProgress.</text><text x="496" y="178.428" fill="#000" font-size="14" textLength="279.275" font-family="Arial">Phiên / quyền không hợp lệ: từ chối truy cập.</text><text x="496" y="194.526" fill="#000" font-size="14" textLength="304.322" font-family="Arial">Cập nhật thất bại: hoàn tác thay đổi của yêu cầu;</text><text x="496" y="210.625" fill="#000" font-size="14" textLength="205.386" font-family="Arial">giữ thay đổi hợp lệ từ xử lý khác.</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="44"><path d="M557,49.099 L557,66.099 L538.602,70.099 L557,74.099 L557,91.296 A0,0 0 0 0 557,91.296 L806.054,91.296 A0,0 0 0 0 806.054,91.296 L806.054,59.099 L796.054,49.099 L557,49.099 A0,0 0 0 0 557,49.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M796.054,49.099 L796.054,59.099 L806.054,59.099 L796.054,49.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="563" y="67.23" fill="#000" font-size="14" textLength="207.026" font-family="Arial">Thuộc TripStatus; chưa có đặc tả</text><text x="563" y="83.329" fill="#000" font-size="14" textLength="228.054" font-family="Arial">sự kiện và điều kiện chuyển vào / ra.</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="49"><path d="M349.5,383.099 L349.5,457.493 A0,0 0 0 0 349.5,457.493 L741.739,457.493 A0,0 0 0 0 741.739,457.493 L741.739,393.099 L731.739,383.099 L505.105,383.099 L455.914,346.161 L497.105,383.099 L349.5,383.099 A0,0 0 0 0 349.5,383.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M731.739,383.099 L731.739,393.099 L741.739,393.099 L731.739,383.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="355.5" y="401.23" fill="#000" font-size="14" textLength="371.239" font-family="Arial">Trip.Completed không đồng nghĩa SharedVehicle.Available.</text><text x="355.5" y="417.329" fill="#000" font-size="14" textLength="207.819" font-family="Arial">Giữ bản ghi Trip sau khi hoàn tất.</text><text x="355.5" y="433.428" fill="#000" font-size="14" textLength="367.35" font-family="Arial">Sau khi lưu thành công: chuyển xe cần sạc qua SUB-CHG;</text><text x="355.5" y="449.526" fill="#000" font-size="14" textLength="293.351" font-family="Arial">xe lỗi sang OutOfService và chuyển SUB-OPS.</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-link-type="dependency"><polygon points="432.5,152.927,436.5,143.927,432.5,147.927,428.5,143.927,432.5,152.927" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M432.5,82.293 C432.5,99.345 432.5,127.043 432.5,147.927" style="stroke:#000;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-link-type="dependency"><polygon points="432.5,305.653,436.5,296.653,432.5,300.653,428.5,296.653,432.5,305.653" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M432.5,193.223 C432.5,222.11 432.5,271.577 432.5,300.653" style="stroke:#000;stroke-width:1;" fill="none"/><text x="569.182" y="251.23" fill="#000" font-size="14" textLength="133.062" font-family="Arial">safeReturnConfirmed</text><text x="524.01" y="267.329" fill="#000" font-size="14" textLength="223.405" font-family="Arial">[đủ điều kiện trả xe; lưu thành công]</text><text x="434.5" y="283.428" fill="#000" font-size="14" textLength="402.425" font-family="Arial">/ lưu thông tin cuối chuyến; cập nhật xe, Hub; ghi lịch sử thay đổi</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk8" data-link-type="dependency"><polygon points="324.826,408.068,332.137,401.47,326.857,403.499,324.827,398.219,324.826,408.068" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M393.077,345.24 C375.479,354.72 355.4,367.595 340.5,383.099 C333.564,390.316 330.264,395.837 326.857,403.499" style="stroke:#000;stroke-width:1;" fill="none"/></g><g class="legend" data-source-line="55"><rect x="127.014" y="479.099" width="583.897" height="138.789" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="132.014" y="497.23" fill="#000" font-size="14" textLength="514.233" font-family="Arial">Nguồn: UC-TRIP-01/02; BR-TRIP-01/02; FR-GEN-03; NFR-REL-01, NFR-AUD-01.</text><text x="132.014" y="513.329" fill="#000" font-size="14" textLength="367.172" font-family="Arial">Điều kiện trả xe: phiên / quyền hợp lệ; đúng chủ Trip và xe;</text><text x="132.014" y="529.428" fill="#000" font-size="14" textLength="162.613" font-family="Arial">Trip.InProgress, xe InUse;</text><text x="132.014" y="545.526" fill="#000" font-size="14" textLength="375.737" font-family="Arial">Hub hợp lệ, có thể nhận xe; xác nhận vị trí và trả xe an toàn.</text><text x="132.014" y="561.625" fill="#000" font-size="14" textLength="517.699" font-family="Arial">safeReturnConfirmed ở bước 5; kiểm tra lại và cập nhật đồng bộ Trip, xe ở bước 7.</text><text x="132.014" y="577.724" fill="#000" font-size="14" textLength="319.942" font-family="Arial">Cập nhật đồng bộ: lưu toàn bộ; nếu lỗi thì hoàn tác.</text><text x="132.014" y="593.822" fill="#000" font-size="14" textLength="573.897" font-family="Arial">Thông tin đầu / cuối chuyến: thời điểm, Hub, pin, tình trạng; cuối chuyến có thêm thời lượng.</text><text x="132.014" y="609.921" fill="#000" font-size="14" textLength="407.859" font-family="Arial">Mất nguồn hoặc hết phiên không tự chuyển Trip sang Interrupted.</text></g><?plantuml-src XLPTQzn657tVNt7xMdPj9sqfI52mjx4TI6tZjKiXoSEiTbOQBCqeend7czA7u8Syb493AIMKqYoccBenTTj0wOgI1nd_3_sJtfdHhkHTDtcovklUUyuzzwmLKp65FSbIwC0QA_DZ3PVFo_mxKBASZ7a8AYh6h9KTC9uIIHBea-0Wb4BpGLV4GiBZY2dQECyYCX2F6RuSaZXhdWpeaEXOhGkkjaX2OLKo4jzytcDFADpwi76O22w2I0fyfwHkXbsLKZnsjVHZBAvnj2KKNNj7lVQEa0CgRuwHAQ8eVDa2k3aIxY-y1Z0WcZjVjTvB9GaJ0Z4P2QqWIwWYdBGYDg10arID47yMO2CK4xobH0fAG5ye9P0P9cbWzrkkdBjyHufGqYohDheYIMEgw61sGL4fTMfsMlVVVmYTpYVDL_KdTB1T74zd8S23Z0pfBbLQygxWGoOJEdZ0xnjXdA8yK2PFDHpWdsVSwkG4ZgWFyTM5Dd9voIC8YjSyVFY0ByzsNnijCGw1BlFd3898Zyh96-v3K4xEK-0H_b4OfmsRkkz36368o_ph88AipCyn0XbPPNxFMdMb1XMYQxKuTX5YEbGWXasS0FlTpjxktPtEoYqFlYZ6WSl4eOzrGiY8WAZCJrAJxDaIthztTO5hPN9D_bOmmzz6J7zol8nJqSRJOeA00dnxsiQguR1uQGet4RfDG7QOy6Q_p5zuXency7KT3raSOt1yTcIwjfyXaGfp23kKIpMKzWAJ9iYfdZ5fKkzXqbyK9fkCcGS7rTrPED