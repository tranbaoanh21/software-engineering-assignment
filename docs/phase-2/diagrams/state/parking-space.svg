34,303.269,222.638,293.43,222.203" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M297.905,224.434 C321.421,236.154 346.84,253.669 358.616,282.099 C371.802,313.934 353.633,352.983 339.76,375.847" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="365.616" y="307.292" fill="#000" font-size="13" textLength="57.808" font-family="Arial">recovered</text></g><g class="legend" data-source-line="31"><rect x="12" y="438.099" width="609.908" height="170.986" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="456.23" fill="#000" font-size="14" textLength="539.984" font-family="Arial">reserve: đủ điều kiện, không xung đột; UC-PARK-01 tạo lượt đặt Confirmed nguyên tử.</text><text x="17" y="472.329" fill="#000" font-size="14" textLength="599.908" font-family="Arial">checkIn: còn hạn, đúng Sinh viên/xe/chỗ, cảm biến xác nhận; lượt đặt CheckedIn, ghi checkInAt.</text><text x="17" y="488.428" fill="#000" font-size="14" textLength="478.297" font-family="Arial">checkOut: cảm biến xác nhận xe đã rời; lượt đặt Completed, ghi checkOutAt.</text><text x="17" y="504.526" fill="#000" font-size="14" textLength="409.186" font-family="Arial">release: hết hạn chưa check-in (NIFR-PARK-01) hoặc hủy hợp lệ;</text><text x="17" y="520.625" fill="#000" font-size="14" textLength="477.75" font-family="Arial">chuyển lượt đặt Expired/Cancelled và hủy giữ chỗ nguyên tử (BR-PARK-02).</text><text x="17" y="536.724" fill="#000" font-size="14" textLength="503.241" font-family="Arial">Thiếu dữ liệu xác minh: chưa mở Reserved; chỉ cập nhật khi có trạng thái hợp lệ.</text><text x="17" y="552.822" fill="#000" font-size="14" textLength="435.695" font-family="Arial">Nếu đã OutOfService, hết hạn chỉ đổi lượt đặt; không phục hồi chỗ lỗi.</text><text x="17" y="568.921" fill="#000" font-size="14" textLength="495.688" font-family="Arial">fault: sự cố đã được xác nhận; ngừng cấp chỗ, chuyển thông tin cho SUB-OPS.</text><text x="17" y="585.02" fill="#000" font-size="14" textLength="561.189" font-family="Arial">recovered: kỹ thuật xác nhận sửa đạt yêu cầu, chỗ trống, không ràng buộc, dữ liệu tin cậy.</text><text x="17" y="601.118" fill="#000" font-size="14" textLength="435.579" font-family="Arial">Cấp phát mới còn cần chỗ và Hub ServiceStatus.Active (BR-HUB-02).</text></g><?plantuml-src VLL1Rzis5BxhLxpTsi5kakrc5m4IOqM30KaGhwSW1vgY9S8KAL2aQ-ysx53i61J3C0n36mH5W0x1khL0KUlGWuh-3_sJFLAIBTlfBh94VlpUzxxt7lrLgacK411ahgo1B666I18ORWI3GrxcFrluT5dcpy7eSd4b8p1nSSNXbEW9bz4m9PG56RwcH9C44YKLZRLA6E9jUoUBIQYUuX4O4v6rTqQ4JYAjh0m7IYWDJsDksliX6nChp2CbpJ51uWFDYRXxVyX_PB3tRMjJgf1bB8MztTtMgYPoubVtTeEOXmnOafevCcLKyzHm9GEZKZ0AHieOXJ6uPjIl1vaX1aLC2HTa95ZzVOPHz9I5zUS9fJRbgqzhJiP3173Q73YIt60U0oL3xeZXuKCQAzpVtm_Elxw0RdT_2nDi7UgYfnAHIpdGWtEiL7ufemuGYIaKB-N57GVnK5kLEqUBjo3A_3T-4GGhmYP4ao4YTVKQB9SQJ9CsOcZCwEH81ikbhc1Zio7LWr06dA-ahaXjkW7NJ32IiRlHcaUnsSxAzqOxdV_5hTH-0RPIt79h3NENRAgcJ6Ct1895J8PrLmNGEDdpCtQ3JvoudonCyEUPxC0aBjxXnCmiFXpYTzE79uFkwS7PzztTFJ0uaGh4vpTbVcqSOF7U0DPup7M2ESZ8pelNQ5MPtpx0O7L9C8dYNmcn6-SEdYeMo3xaCeOfH_ZEZEtG61Fh02qNrpYVl5nyb30hhYX8F7Kh-rin7JCBZv0lYdaJwC0iew93lI_ImOmv6TU0VVidtoPNIIgOOM6B7FagzhebUYwTZwPA2Y6Vtv0AsEKIxXqVFJfhJBiFiK9QYj3yPkwUrwchuxE-rshdUEN9JGdVpLAy0CAT0P6K2O7UJekNDKE4jVeRl6DhZiEzmoReD_UTr1zYbxc5qE65gx2jN4ZG-rujEYdp5yjHwtlQNvnnjsbbbi6UG0-mzzRlurKUBjIn3-GzRVTcPyCbn-tQwbU-aN2_wRmKCQ-yLyzvdQFlUHV4JqmFiZB_1nNcbrMyJvUUYQxtYupA_2_amqnUfT2qL-EsgO8PxaGf63uvx9wS3glorgFJWqcPVq2azIQqkmS5t18l_Ce0sczTb1lRgVKkRyCw9OttHWGZYzD4Esl5yF6HSkuY3xpI5CqrhYX_y6fg7BMicLqFFBOZgDqTuhrkimS7-3ynPRxwZp4HNtoS-Mho_mC0?></g></svg>