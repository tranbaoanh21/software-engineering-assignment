ll="#000" font-size="14" textLength="261.304" font-family="Arial">ServiceStatus độc lập với trạng thái vật lý.</text><text x="241" y="275.329" fill="#000" font-size="14" textLength="304.356" font-family="Arial">Available không đủ để cấp phát nếu chưa Active.</text><text x="241" y="291.428" fill="#000" font-size="14" textLength="350.226" font-family="Arial">Không đổi OutOfService thành Available bằng kích hoạt.</text><text x="241" y="307.526" fill="#000" font-size="14" textLength="338.475" font-family="Arial">ACT-MNT xác nhận lỗi đã khắc phục qua UC-OPS-02.</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="22"><path d="M6,496.099 L6,570.493 A0,0 0 0 0 6,570.493 L377.041,570.493 A0,0 0 0 0 377.041,570.493 L377.041,506.099 L367.041,496.099 L195.5,496.099 L191.5,459.161 L187.5,496.099 L6,496.099 A0,0 0 0 0 6,496.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M367.041,496.099 L367.041,506.099 L377.041,506.099 L367.041,496.099" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="12" y="514.23" fill="#000" font-size="14" textLength="243.612" font-family="Arial">Ngừng Hub kiểm tra cả tài nguyên con.</text><text x="12" y="530.329" fill="#000" font-size="14" textLength="297.192" font-family="Arial">Không tự hủy lượt đặt, Trip, sạc hoặc kế hoạch.</text><text x="12" y="546.428" fill="#000" font-size="14" textLength="298.84" font-family="Arial">Kiểm tra trạng thái và ràng buộc trong giao dịch;</text><text x="12" y="562.526" fill="#000" font-size="14" textLength="350.041" font-family="Arial">cấp phát mới phải kiểm tra cùng điều kiện để tránh race.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-link-type="dependency"><polygon points="191.5,128.962,195.5,119.962,191.5,123.962,187.5,119.962,191.5,128.962" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M191.5,73.342 C191.5,87.456 191.5,106.884 191.5,123.962" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="193.5" y="106.23" fill="#000" font-size="14" textLength="195.357" font-family="Arial">/ tạo bản ghi danh mục và audit</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-link-type="dependency"><polygon points="191.5,257.955,195.5,248.955,191.5,252.955,187.5,248.955,191.5,257.955" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M191.5,169.112 C191.5,193.054 191.5,228.952 191.5,252.955" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="193.5" y="202.23" fill="#000" font-size="14" textLength="403.908" font-family="Arial">resourceActivated [đủ điều kiện theo loại; Hub cha Active nếu có]</text><text x="338.237" y="218.329" fill="#000" font-size="14" textLength="114.434" font-family="Arial">/ lưu lý do và audit</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk7" data-link-type="dependency"><polygon points="162.414,437.123,153.86,432.24,157.439,436.621,153.058,440.2,162.414,437.123" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M166.462,283.606 C140.36,289.785 100.763,303.67 82.5,333.099 C66.564,358.778 64.896,376.533 82.5,401.099 C100.543,426.277 131.72,434.028 157.439,436.621" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="117.22" y="348.23" fill="#000" font-size="14" textLength="128.399" font-family="Arial">resourceDeactivated</text><text x="84.5" y="364.329" fill="#000" font-size="14" textLength="193.84" font-family="Arial">[không còn ràng buộc sử dụng]</text><text x="117.685" y="380.428" fill="#000" font-size="14" textLength="127.47" font-family="Arial">/ chặn cấp phát mới;</text><text x="128.886" y="396.526" fill="#000" font-size="14" textLength="105.068" font-family="Arial">ghi lý do và audit</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polyg