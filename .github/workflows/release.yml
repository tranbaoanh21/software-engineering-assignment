name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: semh-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  images:
    name: Build and publish app image
    needs: checks
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    outputs:
      app: ${{ steps.publish.outputs.app }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
      - name: Build and push SEMH
        id: publish
        shell: bash
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"

          repository=semh-app
          image="$registry/$repository:$GITHUB_SHA"
          docker build --platform linux/amd64 --target production --file apps/api/Dockerfile --tag "$image" .
          docker push "$image"
          digest="$(aws ecr describe-images --repository-name "$repository" \
            --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'app=%s/%s@%s\n' "$registry" "$repository" "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EC2
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      PUBLIC_URL: ${{ vars.PRODUCT_URL }}
      APP_IMAGE: ${{ needs.images.outputs.app }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: Deploy and check URL
        shell: bash
        run: |
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]
          [[ "$PUBLIC_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]
          [[ "$AWS_REGION" =~ ^[a-z0-9-]+$ ]]
          [[ "$APP_IMAGE" =~ ^[A-Za-z0-9.-]+/semh-app@sha256:[0-9a-f]{64}$ ]]

          package="$(mktemp -d)"
          cp infra/ec2/compose.production.yaml infra/ec2/deploy.sh "$package/"
          payload="$(tar -czf - -C "$package" . | base64 -w0)"
          command="set -eu; install -d -m 755 /opt/semh; printf %s '$payload' | base64 -d | tar --no-same-owner --no-overwrite-dir -xzf - -C /opt/semh; bash /opt/semh/deploy.sh '$AWS_REGION' '$APP_IMAGE' '$PUBLIC_URL'"
          parameters="$(jq -nc --arg command "$command" '{commands: [$command], executionTimeout: ["720"]}')"
          id="$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters "$parameters" --query 'Command.CommandId' --output text)"

          status=Pending
          for attempt in $(seq 1 75); do
            status="$(aws ssm get-command-invocation --command-id "$id" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$EC2_INSTANCE_ID" \
            --query '{status: Status, output: StandardOutputContent, errors: StandardErrorContent}'
          test "$status" = Success
          curl --retry 5 --retry-all-errors --max-time 10 -fsS "$PUBLIC_URL/api/health"
          curl --retry 5 --retry-all-errors --max-time 10 -fsS -o /dev/null "$PUBLIC_URL/login"
          curl --retry 5 --retry-all-errors --max-time 10 -fsS -o /dev/null "$PUBLIC_URL/register"
